<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QQBot Host</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#344767;background:#f8f9fe}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#172b4d,#5e72e4);display:grid;place-items:center;padding:24px}.panel{width:min(100%,460px);background:#fff;border-radius:18px;padding:34px;box-shadow:0 24px 60px #101d3b55}.brand{font-size:13px;font-weight:800;letter-spacing:.14em;color:#5e72e4}.title{font-size:25px;margin:12px 0 6px}.sub{color:#8898aa;font-size:14px;margin:0 0 28px}.field{display:block;margin:17px 0 6px;font-size:13px;font-weight:650}.input,select{width:100%;padding:13px 14px;border:1px solid #dce1eb;border-radius:9px;font-size:14px;background:#fff;color:#344767;outline:none}.input:focus,select:focus{border-color:#5e72e4;box-shadow:0 0 0 3px #5e72e422}.btn{width:100%;border:0;border-radius:9px;padding:14px;margin-top:24px;background:linear-gradient(90deg,#5e72e4,#825ee4);color:white;font-weight:700;font-size:14px;cursor:pointer}.btn:disabled{opacity:.6;cursor:wait}.hint{font-size:12px;color:#8898aa;line-height:1.6;margin-top:18px}.status{margin-top:18px;padding:12px;border-radius:8px;background:#f4f6fa;font-size:13px;white-space:pre-wrap}.status.ok{color:#16845b;background:#e9f8f1}.status.err{color:#c03950;background:#fff0f1}</style></head>
<body><main class="panel"><div class="brand">QQBOT HOST / C11</div><h1 class="title">机器人控制台</h1><p class="sub">连接 QQ 官方机器人，管理运行状态与插件</p><form id="login"><label class="field" for="app_id">AppID</label><input class="input" id="app_id" autocomplete="username" required maxlength="127" placeholder="输入机器人 AppID"><label class="field" for="app_secret">AppSecret</label><input class="input" id="app_secret" type="password" autocomplete="current-password" required maxlength="255" placeholder="输入 AppSecret"><label class="field" for="mode">连接方式</label><select id="mode"><option value="websocket">WebSocket（开发中）</option><option value="webhook">Webhook（开发中）</option></select><button class="btn" id="submit" type="submit">验证凭据并登录</button></form><div class="status" id="status">宿主尚未连接。凭据只保存在当前进程内存中，不写入数据库。</div><p class="hint">安全提示：请勿在公共设备输入 AppSecret。生产环境应通过 HTTPS 反向代理访问控制台。</p></main><script>
const form=document.querySelector('#login'),statusBox=document.querySelector('#status'),button=document.querySelector('#submit');form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;statusBox.className='status';statusBox.textContent='正在向 QQ 平台申请 access_token…';try{const res=await fetch('/api/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({app_id:document.querySelector('#app_id').value,app_secret:document.querySelector('#app_secret').value,mode:document.querySelector('#mode').value})});const data=await res.json();if(!res.ok)throw new Error(data.error||'登录失败');statusBox.className='status ok';statusBox.textContent=data.message||'凭据验证成功';document.querySelector('#app_secret').value=''}catch(err){statusBox.className='status err';statusBox.textContent='登录失败：'+err.message}finally{button.disabled=false}});
</script></body></html>
