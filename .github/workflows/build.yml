name: C11 build
on:
  push:
    branches: ["main", "master"]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libmicrohttpd-dev libcurl4-openssl-dev libsqlite3-dev libcjson-dev libssl-dev
      - name: Check dependencies
        run: make check-deps
      - name: Compile C++ SDK header example
        run: c++ -std=c++14 -Wall -Wextra -Wpedantic -Isdk/include -Isdk/cpp -c sdk/cpp/example.cpp -o build-sdk-example.o
      - name: Build with Make
        run: make clean all
      - name: Run Make unit tests
        run: make test
      - name: Configure and build with CMake
        run: |
          cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build-cmake --parallel
          ctest --test-dir build-cmake --output-on-failure

  windows-callback-security:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - name: Set up MinGW64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-curl
      - name: Build Windows callback security test
        run: |
          gcc -std=c11 -D_WIN32 -Wall -Wextra -Wpedantic -Isrc tests/test_callback_security.c src/qq/callback_security.c -o test_callback_security.exe $(pkg-config --cflags --libs libcurl) -lws2_32
      - name: Run Windows callback security test
        run: ./test_callback_security.exe

  windows-full-build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - name: Set up MinGW64 environment
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
      - name: Refresh package databases and install native dependencies
        run: |
          pacman -Syyu --noconfirm
          pacman -S --needed --noconfirm mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja mingw-w64-x86_64-pkgconf mingw-w64-x86_64-gnutls mingw-w64-x86_64-curl mingw-w64-x86_64-sqlite3 mingw-w64-x86_64-cjson mingw-w64-x86_64-openssl zip ca-certificates
          curl -fL https://mirror.msys2.org/mingw/mingw64/mingw-w64-x86_64-libmicrohttpd-1.0.10-1-any.pkg.tar.zst -o libmicrohttpd.pkg.tar.zst
          echo "560a836a918d7bdc5cf5f8a032a43d0700cf1dc7140097e1a1ba1a971b760095  libmicrohttpd.pkg.tar.zst" | sha256sum -c -
          pacman -U --needed --noconfirm ./libmicrohttpd.pkg.tar.zst
      - name: Configure Windows Server 2012 API baseline
        run: cmake -S . -B build-win -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=stage -DCMAKE_C_FLAGS="-D_WIN32_WINNT=0x0602 -DWINVER=0x0602"
      - name: Build Windows host and SDK
        run: cmake --build build-win --parallel
      - name: Run Windows tests
        run: ctest --test-dir build-win --output-on-failure
      - name: Install and assemble runtime layout
        run: |
          cmake --install build-win
          mkdir -p stage/data stage/runtime
          cp -r web stage/
          cp README.md DEPENDENCIES.md stage/
          mv stage/bin/QQBot.exe stage/QQBot.exe
          mv stage/bin/qqbot-core.exe stage/runtime/qqbot-core.exe
          mv stage/bin/libqqbot_sdk.dll stage/runtime/libqqbot_sdk.dll
          cat > stage/桌面版说明.txt <<'EOF'
          QQBot 桌面版
          双击根目录 QQBot.exe 启动原生 Windows 窗口。
          输入 QQ 官方机器人 AppID / AppSecret，选择 WSS 或 Webhook 后登录。
          登录后在主界面查看连接状态与消息日志。
          Webhook 模式仍需公网 HTTPS 回调地址并在 QQ 开放平台完成配置。
          EOF
          mkdir -p stage/certs
          curl -fL --retry 3 --retry-all-errors https://curl.se/ca/cacert.pem -o stage/certs/ca-bundle.crt
          test -s stage/certs/ca-bundle.crt
cat > stage/运行环境说明.txt <<'EOF'
          QQBot Windows x64 一键运行包
          目标 Windows API baseline：Windows 8.1 / Server 2012 (0x0602)
          已包含原生桌面程序、QQ 协议宿主、SDK DLL 和非系统运行时 DLL。
          只需双击根目录 QQBot.exe，无需 BAT 或浏览器。
          登录窗口内输入 AppID/AppSecret 并选择 WSS 或 Webhook。
          后台核心与全部第三方 DLL 放在 runtime 文件夹。
          数据库位于 data\qqbot.db。
          本包仍须在各目标 Windows Server 版本实机验收后才能宣称全版本兼容。
          EOF
      - name: Bundle and verify all non-system DLL dependencies
        run: |
          bash scripts/package-windows.sh stage/runtime stage/QQBot.exe stage/runtime/qqbot-core.exe stage/runtime/libqqbot_sdk.dll
      - name: Audit PE subsystem baseline
        run: bash scripts/check-windows-pe-baseline.sh stage 6 2
      - name: Create ready-to-run ZIP
        run: zip -qr QQBot-Windows-x64-Server2012plus.zip stage
      - name: Upload Windows ready-to-run package
        uses: actions/upload-artifact@v4
        with:
          name: QQBot-Windows-x64-Server2012plus
          path: QQBot-Windows-x64-Server2012plus.zip
          if-no-files-found: error
          retention-days: 30
