name: C11 build
on:
  push:
    branches: ["main", "master"]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libmicrohttpd-dev libcurl4-openssl-dev libsqlite3-dev libcjson-dev libssl-dev
      - name: Check dependencies
        run: make check-deps
      - name: Compile C++ SDK header example
        run: c++ -std=c++14 -Wall -Wextra -Wpedantic -Isdk/include -Isdk/cpp -c sdk/cpp/example.cpp -o build-sdk-example.o
      - name: Build with Make
        run: make clean all
      - name: Run Make unit tests
        run: make test
      - name: Configure and build with CMake
        run: |
          cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build-cmake --parallel
          ctest --test-dir build-cmake --output-on-failure

  windows-callback-security:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - name: Set up MinGW64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-curl
      - name: Build Windows callback security test
        run: |
          gcc -std=c11 -D_WIN32 -Wall -Wextra -Wpedantic -Isrc tests/test_callback_security.c src/qq/callback_security.c -o test_callback_security.exe $(pkg-config --cflags --libs libcurl) -lws2_32
      - name: Run Windows callback security test
        run: ./test_callback_security.exe
